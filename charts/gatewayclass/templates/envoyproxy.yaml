{{- $serviceType := .Values.service.type -}}
{{- $trafficPolicy := get .Values.service "externalTrafficPolicy" -}}
{{- if not (has $serviceType (list "ClusterIP" "NodePort" "LoadBalancer")) -}}
{{- fail "service.type must be ClusterIP, NodePort, or LoadBalancer" -}}
{{- end -}}
{{- if not (kindIs "string" $trafficPolicy) -}}
{{- fail "service.externalTrafficPolicy must be empty, Cluster, or Local" -}}
{{- end -}}
{{- if and $trafficPolicy (not (has $trafficPolicy (list "Cluster" "Local"))) -}}
{{- fail "service.externalTrafficPolicy must be empty, Cluster, or Local" -}}
{{- end -}}
{{- if and $trafficPolicy (eq $serviceType "ClusterIP") -}}
{{- fail "service.externalTrafficPolicy requires NodePort or LoadBalancer" -}}
{{- end -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.name }}-proxy-config
spec:
  mergeGateways: {{ .Values.mergeGateways }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ $serviceType }}
        {{- if $trafficPolicy }}
        externalTrafficPolicy: {{ $trafficPolicy }}
        {{- end }}
        {{- if eq .Values.service.type "NodePort" }}
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  targetPort: 10080
                  nodePort: {{ .Values.service.nodePorts.http }}
                  protocol: TCP
                - name: https-443
                  port: 443
                  targetPort: 10443
                  nodePort: {{ .Values.service.nodePorts.https }}
                  protocol: TCP
        {{- end }}
        {{- if eq .Values.service.type "LoadBalancer" }}
        patch:
          type: StrategicMerge
          value:
            spec:
              {{- if .Values.service.externalIPs }}
              externalIPs:
              {{- range .Values.service.externalIPs }}
                - {{ . | quote }}
              {{- end }}
              {{- end }}
        {{- end }}
