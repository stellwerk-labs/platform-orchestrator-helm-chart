# =============================================================================
# Platform Orchestrator Helm Chart - values.yaml
# =============================================================================
# This file contains the default configuration values for the Platform
# Orchestrator chart. It deploys the following components:
#   - Control Plane (backend-module subchart)
#   - Data Plane (backend-module subchart)
#   - IAM (backend-module subchart)
#   - Console (frontend)
#   - CNPG Databases (PostgreSQL via CloudNativePG)
#   - NATS JetStream (durable message broker)
#   - Embedded Casbin RBAC in IAM (authorization)
#   - Keycloak (identity provider)
# =============================================================================

# -----------------------------------------------------------------------------
# Control Plane
# -----------------------------------------------------------------------------
# The control plane manages organizations, projects, environments, modules,
# and runners. It is deployed as a backend-module subchart.
control-plane:
  # -- Stop the old Control Plane before starting a new version so database
  # migrations never run beside an older writer during upgrades.
  strategy:
    type: Recreate

  # -- Container image for the control plane
  image:
    # -- Image repository. Prepend repository hostname and path as per your setup, e.g. `my-registry.example.com/orchestrator/platform-orchestrator-cp`
    repository: ghcr.io/stellwerk-labs/platform-orchestrator-cp
    # -- Image tag
    tag: v3.2.0@sha256:c1bed2510799230823fbcfd203e095b5ff703d253ca1cd1b0b7505c7c095a59e

  # -- Configuration environment variables (injected via ConfigMap)
  config:
    # -- PostgreSQL database name for the control plane
    DATABASE_NAME: "orchestrator-controlplane"
    # -- PostgreSQL port
    DATABASE_PORT: "5432"
    # -- PostgreSQL host (should match the CNPG cluster service name)
    DATABASE_HOST: platform-orchestrator-cnpg-databases
    # -- Vault authentication string
    # Format: "kubernetes:<service account name>:<audience1>,<audience2>"
    VAULT_AUTH: "kubernetes:platform-orchestrator-control-plane:platform-orchestrator"
    # -- Vault role for the control plane
    VAULT_ROLE: "orchestrator-control-plane"
    # -- OpenTelemetry collector endpoint
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-agent-collector.opentelemetry.svc.cluster.local:4317"
    # -- NATS endpoint used for durable service events
    NATS_URL: "nats://platform-orchestrator-nats:4222"

  # -- Additional environment variables (injected directly into the pod spec)
  # Typically used for secret references
  env:
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: controlplane-db-secret
          key: password
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: controlplane-db-secret
          key: username
    - name: NATS_TOKEN
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: natsAuthToken

  # -- Optional Control Plane profiles. Each is inert until an operator
  # enables it and supplies its settings and referenced Secrets.
  configurationProfiles:
    # -- Ordinary Deployment admission: Core guards each ordinary Deployment
    # against concurrent Pin changes before the Data Plane commits it. Set
    # `DEPLOYMENT_ADMISSION_IDENTITY` to the UUID of the Data Plane's IAM
    # platform principal with a static token. The one identity serves every
    # organization, including organizations created later, so adding an
    # organization needs no change here. Enable together with
    # `data-plane.configurationProfiles.deploymentAdmission`.
    deploymentAdmission:
      enabled: false
      config:
        DEPLOYMENT_ADMISSION_IDENTITY: ""
      requiredConfig:
        - DEPLOYMENT_ADMISSION_IDENTITY
    # -- Offline licence trust is consumed only by Core. This profile does
    # not enable plugins or grant IAM rights. The issuer's private key is never
    # mounted. Only the trust file is mounted: licence bundles are imported
    # through the Plugin Manager API. Use a versioned Secret and restart Core
    # when replacing trust.
    nativePluginEntitlements:
      enabled: false
      config:
        PLUGIN_ENTITLEMENT_MODE: production
        PLUGIN_ENTITLEMENT_TRUST_FILE: /etc/stellwerk/entitlements/trust.json
      secretFiles:
        - name: native-plugin-entitlement-trust
          secretName: ""
          key: trust.json
          mountPath: /etc/stellwerk/entitlements/trust.json
    # -- Native plugin gateway configuration. The signing key remains private
    # to Core; plugin runtimes receive only its public key.
    nativePluginGateway:
      enabled: false
      config:
        PLUGIN_HOST_ENABLED: "true"
        PLUGIN_SIGNING_KEY_FILE: /var/run/secrets/stellwerk/plugins/signing-key.pem
        PLUGIN_ISSUER: stellwerk-control-plane
        PLUGIN_CA_FILE: /var/run/secrets/stellwerk/plugins/plugin-ca.pem
        PLUGIN_DEVELOPMENT_HTTP: "false"
        PLUGIN_DATA_PLANE_INTERNAL_HTTP: "false"
        # Plugin installation state lives in the Core database and is managed
        # through the Plugin Manager API. Its permission holders are configured
        # in IAM (`iam.config.PLUGIN_MANAGER_READERS` and
        # `iam.config.PLUGIN_MANAGER_WRITERS`), so nobody can manage plugins
        # until an operator names them there. Optional Core tuning goes here
        # (or under control-plane.config):
        #
        # Upper bound on how stale a replica's plugin read snapshot (discovery,
        # routing, UI) can be. Core defaults to 2s; allowed range 100ms to 1m.
        # PLUGIN_MANAGER_REFRESH_INTERVAL: "2s"
      secretFiles:
        - name: native-plugin-signing-key
          secretName: ""
          key: signing-key.pem
          mountPath: /var/run/secrets/stellwerk/plugins/signing-key.pem
        - name: native-plugin-ca
          secretName: ""
          key: plugin-ca.pem
          mountPath: /var/run/secrets/stellwerk/plugins/plugin-ca.pem

  # -- Service account configuration
  serviceAccount:
    # -- Allow the service account to create tokens (needed for Vault auth)
    allowCreateToken: true

  # -- Gateway API HTTPRoute configuration for the control plane
  gatewayApi:
    route:
      # -- Path matching rules for control plane API endpoints
      matches:
      - path:
          type: RegularExpression
          value: "/orgs($|/[^/]+($|/(envs|env-types|resource-types|module-providers|runners|runner-rules|modules|module-rules|module-catalogue|module-version-pins|module-version-lifecycle-transactions)($|/.*)|/plugins($|/[^/]+($|/invoke))|/projects($|/[^/]+($|/envs($|/[^/]+($|/(actions/refresh_runner|available-resource-types|deletion-impact)$))))))"
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/module-versions/proposed$"
      - path:
          type: RegularExpression
          value: "^/internal/orgs/[^/]+/projects/[^/]+/envs/[^/]+/module-execution-catalogue$"
        method: POST
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/projects/[^/]+/envs/[^/]+/modules/[^/]+/drafts/[^/]+/test-snapshots$"
        method: POST
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/projects/[^/]+/envs/[^/]+/modules/[^/]+/drafts/[^/]+/test-snapshots$"
        method: OPTIONS
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/projects/[^/]+/envs/[^/]+/modules/[^/]+/draft-test-snapshots/[^/]+$"
        method: GET
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/projects/[^/]+/envs/[^/]+/modules/[^/]+/draft-test-snapshots/[^/]+$"
        method: OPTIONS
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/deployment-admissions/[^/]+(/(settle|seal-absence))?$"
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/projects/[^/]+/envs/[^/]+/deployments/[^/]+/actions/acknowledge-outcome$"
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/plugins/[^/]+/(entitlement|inventory|deployment-reads|authorization-checks|operations/[^/]+(/(modules|authorize|control|check|inventory|resource-events|events|pins(/receipts/[^/]+)?|deployments(/[^/]+/reconcile)?))?)$"
      - path:
          type: RegularExpression
          value: "^/orgs/[^/]+/plugins/[^/]+/projects/[^/]+/envs/[^/]+/deployments/[^/]+/(logs|outputs)$"
      - path:
          type: RegularExpression
          value: "^/(plugin-packages|plugin-installations(/[^/]+(/(identity|upgrade|organization-mode|actions/[^/]+|organizations/[^/]+))?)?|plugin-entitlement-bundles|plugin-audit-events)$"
      # -- Admin API route configuration (rewrites /admin/orgs -> /internal/orgs)
      admin:
        matches:
        - path:
            type: PathPrefix
            value: "/admin/orgs"
        rewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: "/internal/orgs"

# -----------------------------------------------------------------------------
# Data Plane
# -----------------------------------------------------------------------------
# The data plane handles deployments, active resources and logs.
# It is deployed as a backend-module subchart.
data-plane:
  # -- Stop the old Data Plane before starting a new version so database
  # migrations never run beside an older writer during upgrades.
  strategy:
    type: Recreate

  # -- Container image for the data plane
  image:
    # -- Image repository. Prepend repository hostname and path as per your setup, e.g. `my-registry.example.com/orchestrator/platform-orchestrator-dp`
    repository: ghcr.io/stellwerk-labs/platform-orchestrator-dp
    # -- Image tag
    tag: v4.1.0@sha256:58aa4afd98d747ce8aaca42f3ebaeee8e968f40d9749c2bc053d5b16cd5385ec

  # -- Service configuration
  service:
    # -- Select headless mode for the existing data plane Service (required for internal communication)
    createHeadless: true

  # -- Configuration environment variables (injected via ConfigMap)
  config:
    # -- Runner image used for deployments. Prepend repository hostname and path as per your setup, e.g. `my-registry.example.com/orchestrator/platform-orchestrator-runner:vX.Y.Z`
    RUNNER_IMAGE: ghcr.io/stellwerk-labs/platform-orchestrator-runner:v3.1.0@sha256:6a18787b33aa1c4173982ac5876a62b1cde49307fe1f7a4e86b52f1519134d43
    # -- Internal data plane hostname (headless service FQDN)
    # Format: <headless svc name>.<namespace>.svc.cluster.local
    INTERNAL_DATAPLANE_HOSTNAME: platform-orchestrator-data-plane.platform-orchestrator.svc.cluster.local
    # -- Scheduling delay for runner pods
    K8S_RUNNER_POD_SCHEDULING_DELAY: 30s
    # -- OIDC issuer URL for the built-in OIDC provider (leave empty to disable)
    OIDC_ISSUER_URL: ""
    # -- PostgreSQL database name for the data plane
    DATABASE_NAME: "orchestrator-dataplane"
    # -- PostgreSQL port
    DATABASE_PORT: "5432"
    # -- PostgreSQL host (should match the CNPG cluster service name)
    DATABASE_HOST: platform-orchestrator-cnpg-databases
    # -- Vault authentication string
    # Format: "kubernetes:<service account name>:<audience1>,<audience2>"
    VAULT_AUTH: "kubernetes:platform-orchestrator-data-plane:platform-orchestrator"
    # -- Vault role for the data plane
    VAULT_ROLE: "orchestrator-data-plane"
    # -- OpenTelemetry collector endpoint
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-agent-collector.opentelemetry.svc.cluster.local:4317"
    # -- NATS endpoint used for durable deployment and runner messages
    NATS_URL: "nats://platform-orchestrator-nats:4222"
    # -- Public HTTPS gateway used by runner Jobs outside this Kubernetes cluster.
    # Keep the hostname aligned with global.gatewayApi.backend.hostname.
    RUNNER_GATEWAY_URL: "https://api.platform-orchestrator.local/runner-gateway"
    # -- Namespace-qualified gateway for Kubernetes runner Jobs in any namespace of this cluster. Override for a different release name or Orchestrator namespace.
    RUNNER_GATEWAY_INTERNAL_URL: "http://platform-orchestrator-runner-gateway.platform-orchestrator.svc:8080/runner-gateway"
    # -- Most deploy and rollback requests one Environment may hold in its deployment queue
    DEPLOYMENT_QUEUE_MAX_DEPTH: "10"
    # -- How long a queued deploy or rollback waits before it expires, unless the request sets its own TTL
    DEPLOYMENT_QUEUE_DEFAULT_TTL: "2h"
    # -- Longest TTL a queued request may ask for
    DEPLOYMENT_QUEUE_MAX_TTL: "24h"

  # -- Additional environment variables (injected directly into the pod spec)
  # Typically used for secret references
  env:
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dataplane-db-secret
          key: password
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: dataplane-db-secret
          key: username
    - name: NATS_TOKEN
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: natsAuthToken
    - name: RUNNER_TOKEN_SALT
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: runnerTokenSalt

  # -- Optional Data Plane profiles. Each is inert until an operator enables
  # it and supplies its settings and referenced Secrets. The admission
  # endpoints are not public: the operator provides the authenticated HTTPS
  # backend Gateway origin.
  configurationProfiles:
    # -- Ordinary Deployment admission: the Data Plane asks Core to guard each
    # ordinary Deployment before it commits it, with the token of its IAM
    # platform principal, the one that
    # `control-plane.configurationProfiles.deploymentAdmission` names. The
    # plugin admission checker can be the same principal and token. Enable
    # together with the Control Plane profile.
    deploymentAdmission:
      enabled: false
      config:
        DEPLOYMENT_ADMISSION_CORE_GATEWAY_URL: ""
        DEPLOYMENT_ADMISSION_CORE_BEARER_TOKEN_FILE: /var/run/secrets/stellwerk/deployment-admission/core-bearer-token
      requiredConfig:
        - DEPLOYMENT_ADMISSION_CORE_GATEWAY_URL
      httpsOrigins:
        - DEPLOYMENT_ADMISSION_CORE_GATEWAY_URL
      secretFiles:
        - name: deployment-admission-core-token
          secretName: ""
          key: core-bearer-token
          mountPath: /var/run/secrets/stellwerk/deployment-admission/core-bearer-token
    # -- Native external-deployment admission for plugin dispatches, with the
    # verifier key and the plugin admission checker's token.
    nativeExternalDeployment:
      enabled: false
      config:
        EXTERNAL_DEPLOYMENT_ENABLED: "true"
        EXTERNAL_DEPLOYMENT_ISSUER: stellwerk-control-plane
        EXTERNAL_DEPLOYMENT_VERIFICATION_KEY_FILE: /var/run/secrets/stellwerk/plugins/gateway-public-key.pem
        EXTERNAL_DEPLOYMENT_CORE_GATEWAY_URL: ""
        EXTERNAL_DEPLOYMENT_CORE_BEARER_TOKEN_FILE: /var/run/secrets/stellwerk/plugins/core-bearer-token
      requiredConfig:
        - EXTERNAL_DEPLOYMENT_CORE_GATEWAY_URL
      httpsOrigins:
        - EXTERNAL_DEPLOYMENT_CORE_GATEWAY_URL
      secretFiles:
        - name: native-plugin-verification-key
          secretName: ""
          key: gateway-public-key.pem
          mountPath: /var/run/secrets/stellwerk/plugins/gateway-public-key.pem
        - name: native-plugin-core-token
          secretName: ""
          key: core-bearer-token
          mountPath: /var/run/secrets/stellwerk/plugins/core-bearer-token

  # -- Service account configuration
  serviceAccount:
    # -- Allow the service account to create tokens (needed for Vault auth)
    allowCreateToken: true

  # -- Gateway API HTTPRoute configuration for the data plane
  gatewayApi:
    route:
      # -- Path matching rules for data plane API endpoints
      matches:
        - path:
            type: RegularExpression
            value: "/orgs/[^/]+/(deployments|deployment-queue|last-deployments|active-resources|metadata-keys)($|/.*)"
        - path:
            type: RegularExpression
            value: "^/orgs/[^/]+/module-test-deployments$"
          method: POST
        - path:
            type: RegularExpression
            value: "^/orgs/[^/]+/module-test-deployments$"
          method: OPTIONS
      # -- Request timeout for data plane routes
      timeouts:
        request: 45s

  # -- Gateway API HTTPRoute for OIDC endpoints (built-in OIDC provider)
  gatewayApiOidc:
    route:
      matches:
        - path:
            type: RegularExpression
            value: '/\.well-known/(openid-configuration|jwks)$'

# -----------------------------------------------------------------------------
# Runner Gateway
# -----------------------------------------------------------------------------
# The gateway is the only runner-facing component. It translates the public
# HTTPS protocol into the internal JetStream streams and object stores.
runnerGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/stellwerk-labs/platform-orchestrator-runner
    tag: v3.1.0@sha256:6a18787b33aa1c4173982ac5876a62b1cde49307fe1f7a4e86b52f1519134d43
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------------
# IAM (Identity & Access Management)
# -----------------------------------------------------------------------------
# The IAM service handles authentication, authorization, SSO, user management,
# and role-based access control. It is deployed as a backend-module subchart.
iam:
  # -- Replace all IAM pods before starting the new version. This prevents old
  # SpiceDB and new Casbin binaries from sharing the database during upgrades.
  strategy:
    type: Recreate

  # -- Container image for IAM
  image:
    # -- Image repository. Prepend repository hostname and path as per your setup, e.g. `my-registry.example.com/orchestrator/platform-orchestrator-iam`
    repository: ghcr.io/stellwerk-labs/platform-orchestrator-iam
    # -- Image tag
    tag: v2.5.1@sha256:6fd166ec8afba6d2de72eb5913c81c2093dc3bdf1682ee3b2e775e9169ef7a2b

  # -- Configuration environment variables (injected via ConfigMap)
  config:
    # -- Comma-separated Google OAuth client IDs for social login (leave empty to disable)
    ALLOWED_GOOGLE_CLIENT_IDS: ""
    # -- Comma-separated Microsoft OAuth client IDs for social login (leave empty to disable)
    ALLOWED_MICROSOFT_CLIENT_IDS: ""
    # -- SSO callback URL path
    SSO_CALLBACK_URL_PATH: /auth/sso/callback
    # -- Keycloak internal URL (in-cluster service URL)
    KEYCLOAK_INTERNAL_URL: "http://platform-orchestrator-keycloak-service:8080"
    # -- PostgreSQL database name for IAM
    DATABASE_NAME: "orchestrator-iam"
    # -- PostgreSQL port
    DATABASE_PORT: "5432"
    # -- PostgreSQL host (should match the CNPG cluster service name)
    DATABASE_HOST: platform-orchestrator-cnpg-databases
    # -- NATS endpoint used for durable identity events
    NATS_URL: "nats://platform-orchestrator-nats:4222"
    # -- OpenTelemetry collector endpoint
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-agent-collector.opentelemetry.svc.cluster.local:4317"
    # -- Comma-separated user IDs (UUIDs) holding the platform permission
    # `plugin_manager_read` (read the Plugin Manager API). Writers also read,
    # so list read-only operators here. Only users qualify: a service user,
    # the internal system identity or the nil UUID stops IAM from starting.
    # Empty grants read to nobody beyond the writers.
    PLUGIN_MANAGER_READERS: ""
    # -- Comma-separated user IDs (UUIDs) holding the platform permission
    # `plugin_manager_write` (manage plugins through the Plugin Manager API),
    # which includes read. Only users qualify, as for the readers. Empty means
    # nobody can manage plugins.
    PLUGIN_MANAGER_WRITERS: ""

  # -- Additional environment variables (injected directly into the pod spec)
  # Typically used for secret references
  env:
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: iam-db-secret
          key: password
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: iam-db-secret
          key: username
    - name: NATS_TOKEN
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: natsAuthToken
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloak-client-secret
          key: clientSecret
    - name: SSO_STATE_SECRET
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: ssoStateSecret
    - name: SUPER_USER_TOKEN
      valueFrom:
        secretKeyRef:
          name: platform-orchestrator-secrets
          key: superUserToken

  # -- Plugin workload identity (contract level v1alpha). Both profiles are
  # disabled by default, which keeps the token exchange off and renders no RBAC.
  configurationProfiles:
    # -- Exchange projected Kubernetes ServiceAccount tokens of plugin
    # workloads for short-lived IAM tokens. Enabling it requires
    # `PLUGIN_WORKLOAD_TOKEN_ISSUER` and an IAM image with the exchange. IAM
    # then reads the in-cluster JWKS with its own ServiceAccount token and
    # cluster CA; `serviceAccountIssuerDiscovery` mounts that token and binds
    # only the read-only ClusterRole `system:service-account-issuer-discovery`.
    # Set it to false when `pluginWorkloadStaticJWKS` supplies the keys.
    pluginWorkloadIdentity:
      enabled: false
      serviceAccountIssuerDiscovery: true
      requiredConfig:
        - PLUGIN_WORKLOAD_TOKEN_ISSUER
      config:
        # -- The cluster's ServiceAccount token issuer (`--service-account-issuer`),
        # for example `https://kubernetes.default.svc.cluster.local`
        PLUGIN_WORKLOAD_TOKEN_ISSUER: ""
        PLUGIN_WORKLOAD_JWKS_URL: https://kubernetes.default.svc/openid/v1/jwks
        PLUGIN_WORKLOAD_JWKS_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        PLUGIN_WORKLOAD_JWKS_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
        # -- Lifetime of issued plugin workload tokens, 1m to 15m. Never empty:
        # an empty value overrides the IAM default and fails startup.
        PLUGIN_WORKLOAD_TOKEN_TTL: 15m
        # -- Comma-separated IAM principal UUIDs holding the platform-level
        # permission `plugin_workload_binding_write` (the installation controller)
        PLUGIN_WORKLOAD_BINDING_WRITERS: ""
        # -- Transitional adapter keeping static tokens of bound service users
        # usable. Empty disables it; the only accepted version is `v1alpha`.
        PLUGIN_WORKLOAD_STATIC_TOKEN_ADAPTER: ""
    # -- Operator-supplied JWKS for clusters where IAM cannot reach the API
    # server. Mounted read-only from a Secret; roll IAM after replacing it.
    pluginWorkloadStaticJWKS:
      enabled: false
      config:
        PLUGIN_WORKLOAD_JWKS_FILE: /etc/stellwerk/plugin-workload/jwks.json
      secretFiles:
        - name: plugin-workload-jwks
          secretName: ""
          key: jwks.json
          mountPath: /etc/stellwerk/plugin-workload/jwks.json

  # -- Gateway API HTTPRoute configuration for IAM
  gatewayApi:
    route:
      # -- Path matching rules for IAM API endpoints (auth, users, roles, etc.)
      matches:
        - path:
            type: RegularExpression
            value: "/(auth/register|auth/logout|auth/login|auth/device|auth/plugin-workload-token|auth/sso/.+|(plugin-workload-bindings(/[^/]+)?)|(platform-principals(/[^/]+(/actions/regenerate)?)?)|(users/.+)|(orgs/[^/]+/members)|(orgs/[^/]+/memberships.*)|(orgs/[^/]+/users/[^/]+/memberships.*)|(orgs/[^/]+/service-users.*)|(orgs/[^/]+/invitations.*)|(orgs/[^/]+/roles.*)|(orgs/[^/]+/permissions)|(orgs/[^/]+/plugins/[^/]+/capabilities)|(orgs/[^/]+/projects/[^/]+/users.*)|(orgs/[^/]+/projects/[^/]+/envs/[^/]+/users.*)|current-user|auth/check-permissions|(devicelogins/.+)|(orgs/[^/]+/scim/group-mappings.*)|(scim/v2/orgs/[^/]+($|/.*)))"
      # -- Admin API route configuration (rewrites /admin/orgs -> /internal/orgs)
      admin:
        matches:
          - path:
              type: PathPrefix
              value: "/admin/orgs"
        rewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: "/internal/orgs"

# -----------------------------------------------------------------------------
# Console (Frontend)
# -----------------------------------------------------------------------------
# The web-based UI for the Platform Orchestrator.
console:
  # -- Container image for the console
  image:
    # -- Image repository. Prepend repository hostname and path as per your setup, e.g. `my-registry.example.com/orchestrator/platform-orchestrator-frontend`
    repository: ghcr.io/stellwerk-labs/platform-orchestrator-frontend
    # -- Image tag
    tag: v1.5.0@sha256:3db1f2ab9326cbe37a6814b2405d3d4482e9653bb6583cf1ccd11ce74ae7c9f9

  # -- Configuration environment variables (injected via ConfigMap)
  config:
    # -- ConfigCat SDK key for feature flags (leave empty to disable)
    CONFIG_CAT_SDK_KEY: ""
    # -- Datadog client token for RUM monitoring (leave empty to disable)
    DATADOG_CLIENT_TOKEN: ""
    # -- Google OAuth client ID for social login button (leave empty to hide)
    GOOGLE_CLIENT_ID: ""
    # -- Microsoft OAuth client ID for social login button (leave empty to hide)
    MICROSOFT_CLIENT_ID: ""
    # -- Deployment mode identifier
    DEPLOYMENT_MODE: "self-hosted"

# -----------------------------------------------------------------------------
# Subchart Toggles
# -----------------------------------------------------------------------------
# Each subchart can be disabled if you want to use an external service instead
# (e.g., a managed PostgreSQL or an external NATS cluster).

# -- CNPG PostgreSQL databases subchart
cnpg-databases:
  # -- Enable the in-cluster PostgreSQL database (disable to use external DB)
  enabled: true

# -- Official NATS subchart. Disable it when using an external NATS service.
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
    merge:
      authorization:
        token: << $NATS_AUTH_TOKEN >>
  container:
    env:
      NATS_AUTH_TOKEN:
        valueFrom:
          secretKeyRef:
            name: platform-orchestrator-secrets
            key: natsAuthToken
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

messagingBootstrap:
  # -- Provision immutable JetStream streams and the encrypted runner-log object bucket.
  enabled: true
  image: natsio/nats-box:0.19.5
  replicas: 1
  maxBytes:
    events: "1073741824"
    runnerCommands: "536870912"
    runnerEvents: "1073741824"
    deadLetters: "536870912"
    runnerLogs: "2147483648"
    runnerBundles: "3221225472"

# -- Keycloak subchart (identity provider)
keycloak:
  # -- Enable the in-cluster Keycloak
  enabled: true

# =============================================================================
# Global Values
# =============================================================================
# Global values are shared across all subcharts. They control cross-cutting
# concerns like networking, TLS, service discovery, and shared credentials.
global:
  # -- List of image pull secrets for private registries
  # Example:
  #   imagePullSecrets:
  #     - name: my-registry-secret
  imagePullSecrets: []

  # ---------------------------------------------------------------------------
  # TLS Certificates (cert-manager)
  # ---------------------------------------------------------------------------
  certificates:
    # -- Enable automatic TLS certificate generation via cert-manager
    enabled: true
    # -- Create a ClusterIssuer resource (set to false if one already exists)
    createIssuer: true
    # -- Reference to the cert-manager issuer to use for certificates
    issuerRef:
      name: platform-orchestrator-issuer
      kind: ClusterIssuer
    # -- Issuer configuration (only used when createIssuer is true)
    issuer:
      # -- Issuer type: "selfSigned", "ca", or "acme"
      type: selfSigned
      # -- CA issuer configuration (used when type is "ca")
      # Requires a pre-existing secret with tls.crt and tls.key
      ca:
        # -- Name of the secret containing the CA certificate key pair
        secretName: ca-key-pair
      # -- ACME issuer configuration (used when type is "acme")
      acme:
        # -- ACME server URL
        server: https://acme-v02.api.letsencrypt.org/directory
        # -- Email address for ACME registration
        email: ""
        # -- Name of the secret to store the ACME account private key
        privateKeySecretRef: letsencrypt-account-key
        # -- ACME challenge solvers configuration
        # Example HTTP-01 solver:
        #   - http01:
        #       ingress:
        #         class: envoy-gateway
        solvers: []

  # ---------------------------------------------------------------------------
  # Internal Service URLs
  # ---------------------------------------------------------------------------
  # These are used for inter-service communication within the cluster.
  config:
    # -- Internal URL of the data plane service
    DATA_PLANE_URL: http://platform-orchestrator-data-plane:8080
    # -- Internal URL of the control plane service
    CONTROL_PLANE_URL: http://platform-orchestrator-control-plane:8080
    # -- Internal URL of the IAM service
    IAM_URL: http://platform-orchestrator-iam:8080
    # -- Vault URL for secret management
    VAULT_URL: http://openbao.openbao:8200
    # -- NATS endpoint shared by the control plane, data plane, and IAM service
    NATS_URL: nats://platform-orchestrator-nats:4222

  # -- Enable the admin API (generates a superUserToken in the secrets)
  enableAdminApi: true

  # ---------------------------------------------------------------------------
  # Gateway API Configuration
  # ---------------------------------------------------------------------------
  # Configures Kubernetes Gateway API resources (Gateways, HTTPRoutes,
  # SecurityPolicies) for external access to the Platform Orchestrator.
  gatewayApi:
    # -- Enable Gateway API resource creation
    enabled: true
    # -- GatewayClass name to use
    className: envoy-gateway
    # -- Enable Envoy Gateway-specific resources (SecurityPolicy for ext auth, CORS)
    useEnvoyGateway: true

    # -- Backend (API) gateway configuration
    backend:
      # -- Hostname for the API gateway
      hostname: "api.platform-orchestrator.local"
      # -- Enable HTTP listener (port 80)
      http: true
      # -- Enable HTTPS listener (port 443)
      https: true
      # -- TLS configuration for the HTTPS listener
      tls:
        # -- Certificate references for TLS termination
        certificateRefs:
          - name: api-platform-orchestrator-cert
            kind: Secret
      # -- External authentication configuration (Envoy Gateway only)
      extAuth:
        # -- Service name for ext auth (IAM service)
        service: platform-orchestrator-iam
        # -- Service port for ext auth
        port: 8080
      # -- CORS configuration for the backend gateway
      cors:
        # -- Allowed origins. Envoy Gateway turns each `*` into the regex `.*` over the whole origin. No entry may match a `console.gatewayApi.route.pluginUiOrigins` entry: with plugin UIs, list the exact Console origins
        allowOrigins:
          - "https://*.platform-orchestrator.local"
        # -- Allowed HTTP methods
        allowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        # -- Allowed request headers
        allowHeaders:
          - DNT
          - Keep-Alive
          - User-Agent
          - X-Requested-With
          - If-Modified-Since
          - Cache-Control
          - Content-Type
          - Range
          - Authorization
          - Platform-Orchestrator-User-Agent
          - Idempotency-Key
          - If-Match
        # -- Headers exposed to the browser
        exposeHeaders:
          - Etag
          - Link
        # -- Allow credentials (cookies, authorization headers)
        allowCredentials: true
        # -- CORS preflight cache duration
        maxAge: 24h

    # -- Frontend (Console) gateway configuration
    frontend:
      # -- Hostname for the console gateway
      hostname: "console.platform-orchestrator.local"
      # -- Enable HTTP listener (port 80)
      http: true
      # -- Enable HTTPS listener (port 443)
      https: true
      # -- TLS configuration for the HTTPS listener
      tls:
        # -- Certificate references for TLS termination
        certificateRefs:
          - name: console-platform-orchestrator-cert
            kind: Secret
      # -- CORS configuration for the frontend gateway
      cors:
        allowOrigins:
          - "https://*.platform-orchestrator.local"
        allowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowCredentials: true
        maxAge: 24h

    # -- OIDC provider gateway configuration (optional)
    # If specified, exposes the built-in OIDC provider on a dedicated hostname.
    # Set data-plane.config.OIDC_ISSUER_URL to the public URL of this gateway.
    oidc: {}
    #  hostname: "oidc.platform-orchestrator.local"
    #  http: true
    #  https: true
    #  tls:
    #    certificateRefs:
    #      - name: wildcard-cert
    #        kind: Secret

    # -- Keycloak gateway configuration
    keycloak:
      # -- Hostname for the Keycloak gateway
      hostname: "keycloak.platform-orchestrator.local"
      # -- Enable HTTP listener (port 80)
      http: true
      # -- Enable HTTPS listener (port 443)
      https: true
      # -- TLS configuration for the HTTPS listener
      tls:
        # -- Certificate references for TLS termination
        certificateRefs:
          - name: keycloak-platform-orchestrator-cert
            kind: Secret

  # ---------------------------------------------------------------------------
  # Legacy SpiceDB rollback data
  # ---------------------------------------------------------------------------
  legacySpiceDB:
    # -- Preserve and manage the former SpiceDB database, owner, and credentials during the Casbin rollback window. Setting this to false leaves kept resources orphaned for explicit cleanup.
    preserveDatabase: true
    database:
      # -- Legacy SpiceDB PostgreSQL host
      host: platform-orchestrator-cnpg-databases
      # -- Legacy SpiceDB PostgreSQL port
      port: "5432"
      # -- Legacy SpiceDB database name
      name: orchestrator-spicedb
      # -- Legacy SpiceDB database owner
      owner: spicedb_user
      # -- Secret holding the legacy database password
      passwordSecretName: spicedb-db-secret
      # -- Password key in the legacy database secret
      passwordSecretKey: password

  # ---------------------------------------------------------------------------
  # Keycloak Configuration
  # ---------------------------------------------------------------------------
  keycloak:
    # -- Keycloak realm configuration
    realm:
      # -- Realm name
      name: platform-orchestrator
      # -- Realm display name shown in the UI
      displayName: "Platform Orchestrator"
      # -- OIDC client ID for the Platform Orchestrator
      clientId: platform-orchestrator
      # -- Secret name containing the OIDC client secret
      clientSecretName: keycloak-client-secret
    # -- Keycloak database configuration
    database:
      # -- PostgreSQL host for Keycloak
      host: platform-orchestrator-cnpg-databases
      # -- PostgreSQL port for Keycloak
      port: "5432"
      # -- Database name for Keycloak
      name: orchestrator-keycloak
      # -- Database owner/user for Keycloak
      owner: keycloak_user
      # -- Secret name containing the Keycloak database password
      passwordSecretName: keycloak-db-secret
      # -- Key within the secret containing the password
      passwordSecretKey: password
