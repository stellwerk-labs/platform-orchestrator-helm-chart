apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-module.fullname" . }}
  labels:
    {{- include "backend-module.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend-module.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend-module.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "backend-module.fullname" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- if include "backend-module.serviceAccountIssuerDiscovery" . }}
      automountServiceAccountToken: true
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "backend-module.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "backend-module.fullname" . }}-config
          {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $hasSecretFiles := false }}
          {{- range $profileName, $profile := .Values.configurationProfiles }}
            {{- if and $profile.enabled $profile.secretFiles }}
              {{- $hasSecretFiles = true }}
            {{- end }}
          {{- end }}
          {{- if $hasSecretFiles }}
          volumeMounts:
            {{- range $profileName, $profile := .Values.configurationProfiles }}
            {{- if $profile.enabled }}
            {{- range $secretFile := $profile.secretFiles }}
              {{- $name := required (printf "configurationProfiles.%s.secretFiles[].name is required" $profileName) $secretFile.name }}
              {{- $mountPath := required (printf "configurationProfiles.%s.secretFiles[%s].mountPath is required" $profileName $name) $secretFile.mountPath }}
              {{- if not (hasPrefix "/" $mountPath) }}
                {{- fail (printf "configurationProfiles.%s.secretFiles[%s].mountPath must be absolute" $profileName $name) }}
              {{- end }}
            - name: {{ $name }}
              mountPath: {{ $mountPath | quote }}
              subPath: secret-value
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
      {{- if $hasSecretFiles }}
      volumes:
        {{- range $profileName, $profile := .Values.configurationProfiles }}
        {{- if $profile.enabled }}
        {{- range $secretFile := $profile.secretFiles }}
          {{- $name := required (printf "configurationProfiles.%s.secretFiles[].name is required" $profileName) $secretFile.name }}
          {{- $secretName := required (printf "configurationProfiles.%s.secretFiles[%s].secretName is required" $profileName $name) $secretFile.secretName }}
          {{- $key := required (printf "configurationProfiles.%s.secretFiles[%s].key is required" $profileName $name) $secretFile.key }}
        - name: {{ $name }}
          secret:
            secretName: {{ $secretName }}
            items:
              - key: {{ $key }}
                path: secret-value
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
