{{- $pluginUiSources := "" -}}
{{- $pluginUiOrigins := .Values.gatewayApi.route.pluginUiOrigins -}}
{{- if not (kindIs "slice" $pluginUiOrigins) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins must be a list of exact HTTPS origins" -}}
{{- end -}}
{{- $seen := dict -}}
{{- range $origin := $pluginUiOrigins -}}
{{- if not (kindIs "string" $origin) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins entries must be exact HTTPS origins" -}}
{{- end -}}
{{- if not (regexMatch "^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*(:[1-9][0-9]{0,4})?$" $origin) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins entries must be exact HTTPS origins with DNS hostnames and optional ports, without wildcards, credentials, paths, queries, or fragments" -}}
{{- end -}}
{{- $host := trimPrefix "https://" $origin -}}
{{- $hostname := regexReplaceAll ":[0-9]+$" $host "" -}}
{{- if gt (len $hostname) 253 -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins hostname is too long" -}}
{{- end -}}
{{- if regexMatch "^[0-9.]+$" $hostname -}}
{{- if not (regexMatch "^(0|[1-9][0-9]{0,2})(\\.(0|[1-9][0-9]{0,2})){3}$" $hostname) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins IPv4 addresses must use canonical dotted decimal" -}}
{{- end -}}
{{- range $octet := splitList "." $hostname -}}
{{- if gt (atoi $octet) 255 -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins IPv4 octets must be between 0 and 255" -}}
{{- end -}}
{{- end -}}
{{- else if regexMatch "^([0-9]+|0x[0-9a-f]*)$" (last (splitList "." $hostname)) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins DNS hostnames must not end in a numeric label" -}}
{{- end -}}
{{- if contains ":" $host -}}
{{- $port := atoi (last (splitList ":" $host)) -}}
{{- if or (gt $port 65535) (eq $port 443) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins ports must be between 1 and 65535; omit the default HTTPS port 443" -}}
{{- end -}}
{{- end -}}
{{- if eq $hostname (lower $.Values.global.gatewayApi.frontend.hostname) -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins must use a different hostname from the Console" -}}
{{- end -}}
{{- if hasKey $seen $origin -}}
{{- fail "console.gatewayApi.route.pluginUiOrigins must not contain duplicate origins" -}}
{{- end -}}
{{- $_ := set $seen $origin true -}}
{{- $pluginUiSources = printf "%s %s" $pluginUiSources $origin -}}
{{- end -}}
{{- if .Values.global.gatewayApi.enabled }}
{{- $fullname := include "console.fullname" . -}}
{{- with .Values.gatewayApi.route }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "console.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Release.Name }}-frontend-gateway
  hostnames:
    - {{ $.Values.global.gatewayApi.frontend.hostname | quote }}
  rules:
    {{- with .matches }}
    - matches:
        {{- toYaml . | nindent 8 }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ $.Values.service.port }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Cache-Control
                value: "no-cache"
              - name: Pragma
                value: "no-cache"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Content-Security-Policy
                value: {{ printf "script-src 'self' 'unsafe-inline' 'unsafe-eval' accounts.google.com https://hcaptcha.com https://*.hcaptcha.com https://*.wistia.com https://*.wistia.net; frame-src accounts.google.com https://hcaptcha.com https://*.hcaptcha.com%s; worker-src blob:;" $pluginUiSources | quote }}
    {{- end }}
{{- end }}
{{- end }}
