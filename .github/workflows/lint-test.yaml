name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Add NATS chart repository
        run: helm repo add nats https://nats-io.github.io/k8s/helm/charts/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing
        run: ct lint --all --config .ct.yaml

      - name: Test runner gateway contract
        run: bash scripts/runner-gateway_test.sh

      - name: Test Casbin upgrade contract
        run: bash scripts/casbin-upgrade-contract_test.sh

      - name: Test IAM permission catalog route
        run: bash scripts/iam-permission-catalog-contract_test.sh

      - name: Test IAM SCIM route contract
        run: bash scripts/scim-route-contract_test.sh

      - name: Test NATS bootstrap contract
        run: bash scripts/nats-bootstrap-contract_test.sh
