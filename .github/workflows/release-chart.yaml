name: Release Chart

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed stable or candidate chart tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)
        required: true
        type: string
      release_sha:
        description: Approved full 40-character commit SHA identified by the existing tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-helm-chart'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout approved release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: python3 scripts/chart-release-preflight.py "$RELEASE_TAG" "$RELEASE_SHA"

  validate:
    needs: preflight
    uses: ./.github/workflows/lint-test.yaml
    with:
      ref: ${{ inputs.release_sha }}

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-helm-chart'
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tested release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5

      - name: Add NATS chart repository
        run: helm repo add nats https://nats-io.github.io/k8s/helm/charts/

      - name: Validate selected release tag and chart version
        id: chart
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 scripts/chart-release-preflight.py "$RELEASE_TAG" "$RELEASE_SHA"
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/platform-orchestrator/Chart.yaml)"
          bash scripts/chart-release-version.sh "$RELEASE_TAG" "$chart_version" >> "$GITHUB_OUTPUT"
          test -f "docs/releases/$RELEASE_TAG.md"

      - name: Lint and package chart
        run: |
          set -euo pipefail
          helm dependency build charts/platform-orchestrator
          helm lint charts/platform-orchestrator
          mkdir -p dist
          helm package charts/platform-orchestrator --destination dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reserve draft, publish OCI chart and finalize release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.chart.outputs.release_tag }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          PRERELEASE: ${{ steps.chart.outputs.prerelease }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          chart="dist/platform-orchestrator-${CHART_VERSION}.tgz"
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          python3 scripts/chart-release-preflight.py "$RELEASE_TAG" "$RELEASE_SHA" --check-unpublished
          release_flags=()
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$chart" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "${release_flags[@]}" \
            --notes-file "$notes"
          helm push "$chart" oci://ghcr.io/stellwerk-labs/charts
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false "${release_flags[@]}"

      - name: Verify published chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.chart.outputs.release_tag }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | grep -Fx "platform-orchestrator-${CHART_VERSION}.tgz"
          helm show chart oci://ghcr.io/stellwerk-labs/charts/platform-orchestrator \
            --version "$CHART_VERSION" | grep -Fx "version: ${CHART_VERSION}"
